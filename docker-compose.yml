services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: w3s
      POSTGRES_PASSWORD: w3s
      POSTGRES_DB: w3s
    ports: ["127.0.0.1:${POSTGRES_PORT:-55432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U w3s"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-56379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
  redisdata:
